<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>App Finanzas · Fase 1 Demo</title>
  <style>
    body{font-family:Inter,system-ui,sans-serif;background:#0f1220;color:#eef1ff;margin:0}
    .wrap{max-width:980px;margin:0 auto;padding:16px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
    .card{background:#181d30;border:1px solid #2a3250;border-radius:14px;padding:14px}
    h1{font-size:22px;margin:0 0 12px}
    h2{font-size:15px;margin:0 0 10px;color:#b9c3ff}
    label{display:block;font-size:12px;color:#9ba7dc;margin-top:8px}
    input,select,button{width:100%;padding:10px;border-radius:10px;border:1px solid #334069;background:#111730;color:#eef1ff}
    button{background:#5b6cff;border:none;font-weight:600;cursor:pointer}
    button.secondary{background:#2f395f}
    .row{display:flex;gap:8px}
    .row>*{flex:1}
    .list{margin-top:8px;display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto}
    .item{background:#0f152c;border:1px solid #243050;border-radius:10px;padding:10px}
    .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;background:#2f395f;color:#ced6ff}
    .ok{color:#71e28f}.err{color:#ff8e8e}
    small{color:#93a0d1}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Demo Fase 1 · Tarjetas + Instancias + Sync</h1>
    <small>Backend esperado en <code>http://localhost:8787</code> · Auth mock vía Bearer user id.</small>

    <div class="card" style="margin-top:12px">
      <div class="row">
        <div>
          <label>Base URL</label>
          <input id="baseUrl" value="http://localhost:8787" />
        </div>
        <div>
          <label>User ID</label>
          <input id="userId" value="usr_demo" />
        </div>
      </div>
      <p id="status"></p>
    </div>

    <div class="grid" style="margin-top:12px">
      <section class="card">
        <h2>1) Templates prediseñadas</h2>
        <button id="btnLoadTemplates">Cargar templates</button>
        <div id="templates" class="list"></div>
      </section>

      <section class="card">
        <h2>2) Crear tarjeta personalizada</h2>
        <label>Título</label>
        <input id="cardTitle" placeholder="Ej. Tomar agua" />
        <label>Tipo</label>
        <select id="cardType">
          <option value="task">task</option>
          <option value="routine" selected>routine</option>
          <option value="goal">goal</option>
          <option value="study">study</option>
        </select>
        <label>Config JSON</label>
        <input id="cardConfig" value='{"frequency":{"kind":"daily"}}' />
        <button id="btnCreateCard" style="margin-top:10px">Crear tarjeta</button>
        <div id="cards" class="list"></div>
      </section>

      <section class="card">
        <h2>3) Instancias diarias</h2>
        <label>Fecha</label>
        <input id="instanceDate" type="date" />
        <div class="row" style="margin-top:10px">
          <button id="btnGenerate">Generar</button>
          <button id="btnLoadInstances" class="secondary">Cargar</button>
        </div>
        <div id="instances" class="list"></div>
      </section>

      <section class="card">
        <h2>4) Sync queue mock</h2>
        <button id="btnPush">Push cambio demo</button>
        <button id="btnPull" class="secondary" style="margin-top:8px">Pull cambios</button>
        <div id="sync" class="list"></div>
      </section>
    </div>
  </div>
  <script src="./phase1_demo.js"></script>
</body>
</html>
